<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>বোনাস এড | দেশী ইনকাম</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen pb-24">

  <div id="countdownOverlay" class="countdown-overlay">
    <div style="text-align:center;padding:32px;">
      <div style="width:60px;height:60px;background:rgba(245,200,66,0.1);border:1px solid rgba(245,200,66,0.3);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
        <i class="fas fa-star" style="color:var(--gold);font-size:26px;"></i>
      </div>
      <div class="countdown-ring" style="margin:0 auto 20px;">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle cx="90" cy="90" r="80" fill="none" stroke="rgba(245,200,66,0.1)" stroke-width="6"/>
          <circle id="countdownCircle" cx="90" cy="90" r="80" fill="none" stroke="var(--gold)" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="502" stroke-dashoffset="0"
                  transform="rotate(-90 90 90)" style="transition:stroke-dashoffset 1s linear;"/>
        </svg>
        <div class="countdown-number" id="countdownNumber">15</div>
      </div>
      <p style="color:var(--text-primary);font-size:16px;font-weight:600;">বোনাস এড দেখুন...</p>
      <p style="color:var(--text-muted);font-size:13px;margin-top:6px;">১৫ সেকেন্ড অপেক্ষা করুন</p>
    </div>
  </div>

  <div class="container mx-auto px-4 py-5">
    <div class="flex items-center gap-3 mb-5 fade-up fade-up-1">
      <a href="tasks.html" style="width:40px;height:40px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);text-decoration:none;">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div>
        <h1 style="font-size:20px;font-weight:700;color:var(--text-primary);">বোনাস এড</h1>
        <p style="font-size:12px;color:var(--text-muted);">প্রতি এডে <span id="bonusRewardValue">5</span> টাকা</p>
      </div>
    </div>

    <div class="glass-card p-6 mb-5 text-center fade-up fade-up-2">
      <div style="width:80px;height:80px;background:rgba(245,200,66,0.1);border:1px solid rgba(245,200,66,0.2);border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;" class="float">
        <i class="fas fa-star" style="color:var(--gold);font-size:36px;"></i>
      </div>
      <div style="font-size:48px;font-weight:800;font-family:'Sora',sans-serif;" class="text-gold">
        <span id="bonusCounter">0</span><span style="font-size:22px;opacity:0.5;">/10</span>
      </div>
      <div class="progress-track mt-3 mb-3">
        <div id="bonusProgressFill" class="progress-fill progress-gold" style="width:0%"></div>
      </div>
      <p style="font-size:13px;color:var(--text-muted);">প্রতি বোনাস এডে <span style="color:var(--gold);font-weight:700;" id="bonusRewardText">5</span> টাকা</p>
      <p style="font-size:11px;color:var(--text-dim);margin-top:4px;" id="resetTimer">পরবর্তী রিসেট: গণনা হচ্ছে...</p>
    </div>

    <button onclick="window.watchBonusAd()" id="watchBtn" class="btn-primary w-full fade-up fade-up-3" style="font-size:16px;padding:18px;border-radius:18px;">
      ⭐ বোনাস এড দেখুন — <span id="bonusBtnReward">5</span> ৳ আয় করুন
    </button>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>
    const BONUS_REWARD = window.CONFIG.BONUS_AD_REWARD || 5;
    document.getElementById('bonusRewardValue').textContent = BONUS_REWARD;
    document.getElementById('bonusRewardText').textContent = BONUS_REWARD;
    document.getElementById('bonusBtnReward').textContent = BONUS_REWARD;

    let countdownInterval, adOpened = false;
    const TOTAL = 15, CIRCUMFERENCE = 502;

    function getTimeUntilNextHour() {
      const now = new Date(), next = new Date(now);
      next.setHours(now.getHours()+1,0,0,0);
      const m = Math.floor((next-now)/60000);
      return m > 60 ? `${Math.floor(m/60)}ঘ ${m%60}মি` : `${m} মিনিট`;
    }

    function updatePageUI() {
      const count = window.getBonusHourlyCount ? window.getBonusHourlyCount() : parseInt(localStorage.getItem('hourly_bonus_ads_watched')||'0');
      document.getElementById('bonusCounter').textContent = count;
      document.getElementById('bonusProgressFill').style.width = `${(count/10)*100}%`;
      document.getElementById('resetTimer').textContent = `পরবর্তী রিসেট: ${getTimeUntilNextHour()}`;
      const btn = document.getElementById('watchBtn');
      if (count >= 10) {
        btn.disabled = true;
        btn.innerHTML = '❌ এই ঘন্টায় লিমিট শেষ';
        btn.style.opacity = '0.5';
      }
    }

    async function watchBonusAd() {
      const user = getCurrentUser();
      if (!user) { alert('ডেটা লোড হয়নি!'); return; }
      const count = window.getBonusHourlyCount ? window.getBonusHourlyCount() : parseInt(localStorage.getItem('hourly_bonus_ads_watched')||'0');
      if (count >= 10) { alert('❌ লিমিট শেষ!'); return; }
      if (adOpened) { alert('এড ইতিমধ্যে খোলা আছে!'); return; }

      const btn = document.getElementById('watchBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> খোলা হচ্ছে...';
      
      const link = window.CONFIG.AD_LINKS[Math.floor(Math.random() * window.CONFIG.AD_LINKS.length)];
      
      const a = document.createElement('a');
      a.href = link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      adOpened = true;

      document.getElementById('countdownOverlay').style.display = 'flex';
      let seconds = TOTAL;
      const numEl = document.getElementById('countdownNumber');
      const circEl = document.getElementById('countdownCircle');
      numEl.textContent = seconds;

      countdownInterval = setInterval(() => {
        seconds--;
        numEl.textContent = seconds;
        circEl.style.strokeDashoffset = ((TOTAL - seconds) / TOTAL) * CIRCUMFERENCE;
        if (seconds <= 0) { clearInterval(countdownInterval); finishBonusAd(); }
      }, 1000);
    }

    async function finishBonusAd() {
      document.getElementById('countdownOverlay').style.display = 'none';
      const result = await window.addBonusEarning(BONUS_REWARD);
      updatePageUI();
      if (result && result.success) {
        alert(`✅ ${BONUS_REWARD} টাকা বোনাস যোগ হয়েছে!`);
        const count = window.getBonusHourlyCount ? window.getBonusHourlyCount() : parseInt(localStorage.getItem('hourly_bonus_ads_watched')||'0');
        if (count < 10) {
          document.getElementById('watchBtn').disabled = false;
          document.getElementById('watchBtn').innerHTML = `⭐ বোনাস এড দেখুন — ${BONUS_REWARD} ৳ আয় করুন`;
        }
      } else {
        alert(result?.error || '❌ কোনো সমস্যা হয়েছে।');
        document.getElementById('watchBtn').disabled = false;
        document.getElementById('watchBtn').innerHTML = `⭐ বোনাস এড দেখুন — ${BONUS_REWARD} ৳ আয় করুন`;
      }
      adOpened = false;
    }

    window.watchBonusAd = watchBonusAd;
    window.updatePageUI = updatePageUI;

    document.addEventListener('DOMContentLoaded', () => { 
      updatePageUI(); 
      setInterval(updatePageUI, 30000); 
    });
  </script>
</body>
</html>
